name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          CI: "true"
      - run: npm run test:ci
      - name: Staging password gate tests
        run: npm run test:gate
      - name: SPA fallback present in build
        run: grep -q 'index.html' build/_redirects
      - if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build
          retention-days: 7

  deploy-scripts:
    name: deploy scripts (shellcheck + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck scripts/*.sh
      - run: python -m unittest discover -s scripts/tests -v

  deploy:
    name: deploy to Cloudflare Pages
    needs: [build, deploy-scripts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      STAGING_HOST: staging.qg-frontend.grandkru.com
      PAGES_PROJECT: qg-frontend-v2
      QUEERGLOBAL_BASIC_AUTH_USER: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_USER }}
      QUEERGLOBAL_BASIC_AUTH_PASS: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_PASS }}
    steps:
      - name: Require Cloudflare and staging gate secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_ZONE_ID secrets are not set on this repo"
            exit 1
          fi
          if [ -z "$QUEERGLOBAL_BASIC_AUTH_USER" ] || [ -z "$QUEERGLOBAL_BASIC_AUTH_PASS" ]; then
            echo "::error::QUEERGLOBAL_BASIC_AUTH_USER / QUEERGLOBAL_BASIC_AUTH_PASS secrets are not set on this repo"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Stage build output and Pages Functions middleware
        run: bash scripts/stage-pages-deploy.sh build "$RUNNER_TEMP/site"
      - name: Require Pages project (do not create)
        run: bash scripts/ensure-pages-project.sh "$PAGES_PROJECT"
      - name: Sync staging gate secrets to Pages project
        run: bash scripts/sync-pages-basic-auth-secrets.sh "$PAGES_PROJECT"
      - id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site --project-name qg-frontend-v2 --branch main
      - name: Smoke test deployment URL
        env:
          DEPLOY_URL: ${{ steps.wrangler.outputs.deployment-url }}
          BASIC_AUTH_USER: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ secrets.QUEERGLOBAL_BASIC_AUTH_PASS }}
          SMOKE_PATHS: / /about /blog /donate /favicon.ico
        run: |
          echo "deployment: $DEPLOY_URL"
          bash scripts/smoke-basic-auth.sh "$DEPLOY_URL"
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Attach ${{ env.STAGING_HOST }} (Pages custom domain + DNS CNAME)
        run: src/scripts/cf-pages-domain.sh "$PAGES_PROJECT" "$STAGING_HOST"
      - name: Smoke test ${{ env.STAGING_HOST }} (custom host gate)
        env:
          SMOKE_PATHS: / /about /blog /donate /favicon.ico
        run: bash scripts/smoke-staging-custom-host.sh "https://$STAGING_HOST"
